name: cookbook
description: "Vegetarian Cookbook - Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.0

  # Audio
  just_audio: ^0.9.0
  audio_session: ^0.1.0

  # Storage
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # XML parsing
  xml: ^6.4.0

  # Utils
  intl: ^0.20.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/content/
    - assets/images/covers/
    - assets/images/sprites/
    - assets/data/

  fonts:
    - family: MurariChandUni
      fonts:
        - asset: assets/fonts/MurariChandUni.ttf
